[project]
name = "ai-agent-python"
version = "0.1.0"
description = "Briefing and XSS intelligence agents driven by the Claude CLI"
license = "MIT"
# The supported range is proven by the pytest matrix in
# .github/workflows/pytest.yml — every version named here is run there, and
# tests/test_python_version_support.py fails if the two ever drift apart.
requires-python = ">=3.11,<3.14"

# Dependencies are managed with requirements.in / requirements.txt rather than
# here, so this file is metadata only and is never built or installed.
[tool.uv]
package = false

# Lint only: correctness checks (pyflakes errors, syntax, import position).
# Formatting is deliberately not enforced — most of the tree predates any
# formatter, and a one-shot reformat would bury real history. Run in CI by
# .github/workflows/lint.yml.
[tool.ruff]
target-version = "py311"
extend-exclude = ["config", "input", "output", "log"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These modules set env vars / warning filters / sys.path before importing.
"src/local_llm/cli.py" = ["E402"]
"src/local_llm/indexer.py" = ["E402"]
"tests/conftest.py" = ["E402"]
# Package __init__ modules re-export names (tests import some private ones).
"**/__init__.py" = ["F401"]
# `l` is a natural name for a line in the text-processing tests.
"tests/**" = ["E741"]
