name: docker

# Builds the image from the real Dockerfile and boots it through compose.yaml,
# so what a user runs is what is tested. Covers the parts a developer machine
# without Docker cannot: the apt and uv layers, the published port, the
# privilege drop, and that the app is not reachable from the runner's LAN
# address. It never calls Claude (a fake login is enough to boot).
#
# Runs on every PR to dev or main — deliberately NOT path-filtered, for the
# same reason as pytest.yml (#447): the job always starts and decides
# internally whether the change can affect the image.
on:
  pull_request:
    branches:
      - dev
      - main

# Read-only token: the job only checks out and tests the code.
permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRIEF_LENS_PORT: "3900"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether the image inputs changed
        id: changed
        uses: ./.github/actions/changed-paths
        with:
          pattern: '^(apps/|packages/brief-lens/|Dockerfile$|compose(\.output)?\.yaml$|\.dockerignore$|docker/|\.github/(workflows/docker\.yml$|actions/changed-paths/))'
          base-sha: ${{ github.event.pull_request.base.sha }}

      # A fake login in the shape the Linux CLI keeps. Going through the real
      # script also exercises it, and leaves the directory owned by the runner
      # user (uid 1001), not the image's `node` (uid 1000).
      - name: Export a fake login
        if: steps.changed.outputs.changed == 'true'
        run: |
          fake="$RUNNER_TEMP/fakehome"
          mkdir -p "$fake/.claude"
          printf '%s' '{"claudeAiOauth":{"accessToken":"sk-ant-oat01-fake","refreshToken":"sk-ant-ort01-fake","expiresAt":9999999999999,"scopes":["user:inference"],"subscriptionType":"max"}}' \
            > "$fake/.claude/.credentials.json"
          HOME="$fake" BRIEF_LENS_AUTH_DIR="$RUNNER_TEMP/auth" docker/sync-claude-auth.sh
          echo "BRIEF_LENS_AUTH_DIR=$RUNNER_TEMP/auth" >> "$GITHUB_ENV"

      - name: Build and start
        if: steps.changed.outputs.changed == 'true'
        run: docker compose up -d --build

      - name: Wait for the Web UI
        if: steps.changed.outputs.changed == 'true'
        run: |
          # First start installs the Python environment into the data volume.
          for _ in $(seq 1 300); do
            if curl -fsS "http://127.0.0.1:${BRIEF_LENS_PORT}/api/health" >/dev/null 2>&1; then exit 0; fi
            if [ "$(docker compose ps --status running -q | wc -l)" = 0 ]; then docker compose logs; exit 1; fi
            sleep 3
          done
          docker compose logs
          echo "Web UI did not answer in time" >&2
          exit 1

      - name: Published port is loopback-only
        if: steps.changed.outputs.changed == 'true'
        run: |
          lan_ip="$(hostname -I | awk '{print $1}')"
          echo "runner LAN address: $lan_ip"
          test -n "$lan_ip"
          if curl -sS -m 5 -o /dev/null "http://${lan_ip}:${BRIEF_LENS_PORT}/"; then
            echo "Web UI is reachable on the LAN address" >&2
            exit 1
          fi
          docker compose ps --format '{{.Ports}}' | grep -q "127.0.0.1:${BRIEF_LENS_PORT}->3000/tcp"

      - name: API routes reject non-loopback Host names
        if: steps.changed.outputs.changed == 'true'
        run: |
          base="http://127.0.0.1:${BRIEF_LENS_PORT}/api/health"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost' "$base")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: 192.168.1.5' "$base")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: host.docker.internal' "$base")" = 403

      - name: App runs as node with no capabilities
        if: steps.changed.outputs.changed == 'true'
        run: |
          docker compose exec -T brief-lens sh -c '
            seen=0
            for pid in $(ls /proc | grep -E "^[0-9]+$"); do
              [ "$pid" = "$$" ] && continue
              cmd=$(tr "\0" " " < /proc/$pid/cmdline 2>/dev/null)
              case "$cmd" in
                *brief-lens.mjs*|*uvicorn*|*next-server*)
                  uid=$(awk "/^Uid/{print \$2}" /proc/$pid/status)
                  cap=$(awk "/^CapEff/{print \$2}" /proc/$pid/status)
                  echo "pid=$pid uid=$uid cap=$cap"
                  seen=$((seen + 1))
                  [ "$uid" = 1000 ] && [ "$cap" = 0000000000000000 ] || exit 1 ;;
              esac
            done
            # Launcher, uvicorn and next-server: a rename must not turn this check into a no-op.
            [ "$seen" -ge 3 ] || { echo "only $seen app processes matched, expected 3+"; exit 1; }'

      - name: Login installed and tools present
        if: steps.changed.outputs.changed == 'true'
        run: |
          docker compose exec -T -u node brief-lens sh -c '
            set -e
            test -s /home/node/.claude/.credentials.json
            claude --version
            /data/runtime/venv/bin/python -c "import sys; assert (3,11) <= sys.version_info[:2] <= (3,13), sys.version"
            ls /usr/share/fonts/opentype/noto/ | grep -q CJK'

      # The runner's uid is not the image's, so the folder is given to uid 1000:
      # that is the documented Linux requirement for this override.
      - name: Output override shares only the output folder
        if: steps.changed.outputs.changed == 'true'
        run: |
          out="$RUNNER_TEMP/output"
          mkdir "$out"
          sudo chown 1000:1000 "$out"
          export BRIEF_LENS_OUTPUT_DIR="$out"
          dc() { docker compose -f compose.yaml -f compose.output.yaml "$@"; }
          dc up -d
          for _ in $(seq 1 100); do
            curl -fsS "http://127.0.0.1:${BRIEF_LENS_PORT}/api/health" >/dev/null 2>&1 && break
            sleep 3
          done
          dc exec -T -u node brief-lens sh -c 'umask 077; echo from-container > /data/output/probe.md'
          sudo grep -qx from-container "$out/probe.md"
          echo from-host | sudo tee "$out/probe.md" >/dev/null
          dc exec -T -u node brief-lens grep -qx from-host /data/output/probe.md
          test -z "$(sudo find "$out" -name session-token -o -name .env)"

      - name: Logs on failure
        if: failure() && steps.changed.outputs.changed == 'true'
        run: docker compose logs --no-color | tail -n 200

      - name: Tear down
        if: always() && steps.changed.outputs.changed == 'true'
        run: docker compose down -v
