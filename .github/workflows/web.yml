name: web

on:
  pull_request:
    branches:
      - dev
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        # `npm install` (not `npm ci`) because the lockfile is generated on
        # macOS and omits some Linux-only optional transitive deps (e.g.
        # @emnapi/core, @emnapi/runtime — WASM fallbacks for native swc
        # modules). `npm ci` rejects the lockfile as out of sync; `npm
        # install` heals it in place without modifying the committed file.
        working-directory: apps/web
        run: npm install

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Test
        working-directory: apps/web
        run: npm run test

      - name: Build
        working-directory: apps/web
        run: npm run build
