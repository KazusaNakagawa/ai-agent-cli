name: web

on:
  pull_request:
    branches:
      - dev
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        # `npm install` (not `npm ci`) because the lockfile is generated on
        # macOS and omits some Linux-only optional transitive deps (e.g.
        # @emnapi/core, @emnapi/runtime — WASM fallbacks for native swc
        # modules). `npm ci` rejects the lockfile as out of sync; `npm
        # install` heals it in place without modifying the committed file.
        working-directory: apps/web
        run: npm install

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Test
        working-directory: apps/web
        run: npm run test

      - name: Build
        working-directory: apps/web
        run: npm run build
