name: web

# Runs on every PR to dev — deliberately NOT path-filtered, and the job is named
# `web` rather than `test` so it reports a status context distinct from
# pytest.yml's. Two workflows reporting the same context name let a real failure
# be masked by an unrelated pass. See #447.
on:
  pull_request:
    branches:
      - dev

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether web code changed
        id: changed
        uses: ./.github/actions/changed-paths
        with:
          pattern: '^(apps/web/|\.github/(workflows/web\.yml$|actions/changed-paths/))'
          base-sha: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        if: steps.changed.outputs.changed == 'true'
        working-directory: apps/web
        run: npm ci

      - name: Lint
        if: steps.changed.outputs.changed == 'true'
        working-directory: apps/web
        run: npm run lint

      - name: Test
        if: steps.changed.outputs.changed == 'true'
        working-directory: apps/web
        run: npm run test

      - name: Build
        if: steps.changed.outputs.changed == 'true'
        working-directory: apps/web
        run: npm run build
