name: pytest

# Runs on every PR to dev — deliberately NOT path-filtered.
# `test` is a required status check on dev. A path-filtered workflow reports
# nothing when it is skipped, so the required context stays pending forever and
# docs-only PRs become unmergeable without an admin override (#447).
# The job therefore always starts and decides internally whether to do real work.
on:
  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether Python code changed
        id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(apps/python/|\.github/workflows/pytest\.yml$)'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "Python changes detected — running the suite."
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
            echo "No Python changes — skipping the suite and reporting success."
          fi

      - uses: actions/setup-python@v5
        if: steps.changed.outputs.python == 'true'
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.changed.outputs.python == 'true'
        run: pip install uv

      - name: Install dependencies
        if: steps.changed.outputs.python == 'true'
        working-directory: apps/python
        run: uv pip sync requirements.txt --system

      - name: Run pytest
        if: steps.changed.outputs.python == 'true'
        working-directory: apps/python
        run: pytest -v
