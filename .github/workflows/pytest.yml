name: pytest

on:
  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip sync requirements.txt --system

      - name: Create config from example
        run: cp config/briefing.json.example config/briefing.json

      - name: Run pytest
        run: pytest -v
