name: publish

# Publish brief-lens to npm from a version tag (e.g. v0.1.0). The job runs in
# the `npm-publish` environment so it waits for a manual approval. It holds no
# npm token: npm trusts this workflow + environment as a trusted publisher and
# the job authenticates with its OIDC token instead.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write  # trusted publishing (OIDC) and provenance

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Tag must match package version
        working-directory: packages/brief-lens
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      # Trusted publishing needs npm 11.5.1+; fail here rather than with an
      # auth error at publish time if the bundled npm is older.
      - name: npm must support trusted publishing
        run: |
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) { console.error(`npm ${process.argv[1]} < 11.5.1`); process.exit(1); }
          ' "$(npm --version)"

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Test launcher
        working-directory: packages/brief-lens
        run: npm test

      - name: Publish (prepack builds dist/)
        working-directory: packages/brief-lens
        run: npm publish --provenance --access public
