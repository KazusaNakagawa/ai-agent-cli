name: publish

# Publish brief-lens to npm from a version tag (e.g. v0.1.0). The job runs in
# the `npm-publish` environment so it waits for a manual approval, and needs
# an NPM_TOKEN secret on that environment.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write  # npm provenance

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Tag must match package version
        working-directory: packages/brief-lens
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Test launcher
        working-directory: packages/brief-lens
        run: npm test

      - name: Publish (prepack builds dist/)
        working-directory: packages/brief-lens
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
